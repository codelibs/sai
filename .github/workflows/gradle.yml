name: Java CI with Gradle

on:
  push:
    branches: [ master ]
  # Every pull request, not just those targeting master, so the intermediate
  # branches in a stacked series are checked too.
  pull_request:

permissions:
  contents: read

# A new push to the same branch makes the in-flight run redundant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    # Caches the Gradle user home and the configuration cache, and writes a build
    # summary onto the job page. Replaces setup-java's `cache: gradle`.
    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@v4

    # One invocation rather than three: `build` covers compile, test, javadoc and
    # the JARs, and the mode tests share a code cache so they must not overlap.
    - name: Build and test
      run: ./gradlew build testOptimistic testPessimistic

    - name: Upload test reports
      if: failure()
      uses: actions/upload-artifact@v7
      with:
        name: test-reports
        path: |
          build/reports/tests/
          build/test-results/
        retention-days: 7
